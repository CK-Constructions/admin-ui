when:
    event: [push, cron]
    branch: secondphase

steps:
    deploy:
        image: docker:git
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        commands:
            - docker compose -p tomthin-admin down
            - docker compose -p tomthin-admin build
            - docker compose -p tomthin-admin up -d
