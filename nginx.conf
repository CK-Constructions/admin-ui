# nginx.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This is the magic part — serves index.html for any non-file path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proper handling for static assets with hashes (Next.js _next/*)
    location /_next/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Security headers (optional but nice)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}